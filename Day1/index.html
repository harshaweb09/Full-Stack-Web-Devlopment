<!doctype html>
<html lang="en">
  <head>
    <!-- The essential three tags of head  -->
    <meta charset="UTF-8" />
    <!-- It is better to put charset at top of head tag to prevent character encoding issues -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=0"
    />
    <!-- default value of user scalable is one  -->
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.ico" />
    <link rel="alternate" href="https://example.com" hreflang="en" />
    <link rel="alternate" href="https://example.com/es" hreflang="es" />
    <link rel="canonical" href="https://example.com" />
    <script src="script.js" defer></script>
    <title>Text that is displayed on browser tab</title>
  </head>
  <body></body>
</html>
