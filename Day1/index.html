<!doctype html>
<html lang="en">
  <head>
    <!-- The essential three tags of head  -->
    <meta charset="UTF-8" />
    <!-- It is better to put charset at top of head tag to prevent character encoding issues -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=0"
    />
    <!-- default value of user scalable is one  -->
    <title>Text that is displayed on browser tab</title>
  </head>
  <body></body>
</html>
